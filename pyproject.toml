[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promisekeeper"
version = "0.1.0"
description = "PromiseKeeper - delivery-promise risk simulator built on the Reality Compiler engine, with Hindsight agent memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
memory = ["hindsight-client>=0.1"]
ui = ["streamlit>=1.31"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27"]
all = ["hindsight-client>=0.1", "streamlit>=1.31", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
pk = "promisekeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
